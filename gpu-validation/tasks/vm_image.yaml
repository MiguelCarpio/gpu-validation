---
- name: Check if image with the correct name already exists in Glance
  openstack.cloud.image_info:
    name: "{{ gpu_validation_image_name }}"
    ca_cert: "{{ gpu_validation_ca_cert_path }}"
  register: _gpu_validation_image_info

- name: Set fact if image exists
  ansible.builtin.set_fact:
    _gpu_validation_image_exists: "{{ (_gpu_validation_image_info.images | length) > 0 }}"

- name: Require an RHSM key for the RHEL image path
  ansible.builtin.assert:
    that:
      - gpu_validation_rhsm_activationkey | string | length > 0
      - gpu_validation_rhsm_org | string | length > 0
    fail_msg: "A built RHEL guest has no repos; set gpu_validation_rhsm_activationkey and gpu_validation_rhsm_org to enable dnf."
  when:
    - not _gpu_validation_image_exists | bool
    - gpu_validation_redhat_offline_token | length > 0
    - gpu_validation_redhat_image_distribution is match('^rhel-')

- name: Build RHEL image via the Red Hat Image Builder API
  ansible.builtin.include_tasks: build_rhel_image.yaml
  when:
    - not _gpu_validation_image_exists | bool
    - gpu_validation_redhat_offline_token | length > 0

- name: Resolve the image download URL and destination
  ansible.builtin.set_fact:
    _gpu_validation_image_src_url: >-
      {{ _gpu_validation_rhel_image_url | default('')
         if (gpu_validation_redhat_offline_token | length > 0)
         else gpu_validation_image_url }}
    _gpu_validation_image_file: "{{ gpu_validation_image_cache_dir }}/{{ gpu_validation_image_name }}.qcow2"
  no_log: "{{ gpu_validation_redhat_offline_token | length > 0 }}"
  when: not _gpu_validation_image_exists | bool

- name: Create a private cache dir for the downloaded image
  ansible.builtin.file:
    path: "{{ gpu_validation_image_cache_dir }}"
    state: directory
    mode: '0700'
  when: not _gpu_validation_image_exists | bool

- name: Download VM image
  ansible.builtin.get_url:
    url: "{{ _gpu_validation_image_src_url }}"
    dest: "{{ _gpu_validation_image_file }}"
    mode: '0600'
    force: true
  no_log: "{{ gpu_validation_redhat_offline_token | length > 0 }}"
  when: not _gpu_validation_image_exists | bool

- name: Create glance image from GPU validation download source
  openstack.cloud.image:
    name: "{{ gpu_validation_image_name }}"
    container_format: bare
    disk_format: qcow2
    filename: "{{ _gpu_validation_image_file }}"
    visibility: public
    ca_cert: "{{ gpu_validation_ca_cert_path }}"
  when: not _gpu_validation_image_exists | bool

- name: Remove the downloaded image after upload
  ansible.builtin.file:
    path: "{{ _gpu_validation_image_file }}"
    state: absent
  when: not _gpu_validation_image_exists | bool

- name: Reset extra_specs_default for vGPU scheduling safe defaults
  ansible.builtin.set_fact:
    gpu_validation_extra_specs_default:
      "resources:VGPU": "1"
  when: gpu_validation_mode in ["mig", "vgpu"]

- name: Check for duplicated parameters in extra_specs
  when:
    - gpu_validation_mem_page_size | string | length > 0
    - gpu_validation_extra_specs.get('hw:mem_page_size', '') | string | length > 0
  ansible.builtin.fail:
    msg: "Duplicated parameters in extra_specs: hw:mem_page_size. Use gpu_validation_mem_page_size instead."

- name: Add hugepage support to extra_specs
  vars:
    _gpu_validation_extra_specs: "{{ gpu_validation_extra_specs_default }}"
  ansible.builtin.set_fact:
    gpu_validation_extra_specs_default: "{{ _gpu_validation_extra_specs |
      combine({'hw:mem_page_size': gpu_validation_mem_page_size | string},
              recursive=true) }}"
  when: gpu_validation_mem_page_size | string | length > 0

- name: Merge with user-specified extra_specs
  ansible.builtin.set_fact:
    _gpu_validation_extra_specs_merged: "{{ gpu_validation_extra_specs_default |
      combine(gpu_validation_extra_specs, recursive=true) }}"

- name: Create flavor for GPU validation
  openstack.cloud.compute_flavor:
    name: "{{ gpu_validation_flavor_name }}"
    ram: "{{ gpu_validation_flavor_ram }}"
    vcpus: "{{ gpu_validation_flavor_vcpus }}"
    disk: "{{ gpu_validation_flavor_disk }}"
    extra_specs: "{{ _gpu_validation_extra_specs_merged }}"
    ca_cert: "{{ gpu_validation_ca_cert_path }}"
  register: _gpu_validation_flavor
