---
- name: "TEST[gpus pci-present] Check that the expected GPU PCI devices are present in the VM (lspci)"
  ansible.builtin.shell: |
    set -o pipefail
    echo "{{ lspci_output.stdout }}" | grep '{{ item.key }}' | wc -l
  register: pci_count
  loop: "{{ gpu_validation_pci_devices | dict2items }}"
  vars:
    expected_count: "{{ item.value }}"
  failed_when: pci_count.stdout | int != expected_count | int
  changed_when: false
