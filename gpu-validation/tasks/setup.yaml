---
- name: Set DNS server using nmcli if gpu_validation_dns_server is set
  ansible.builtin.shell: |
    nmcli con mod "System eth0" ipv4.dns "{{ gpu_validation_dns_server }}" ipv4.ignore-auto-dns yes
    nmcli con up "System eth0"
  when: gpu_validation_dns_server != ""
  changed_when: true

- name: Configure HTTP/HTTPS proxy for outbound connections
  ansible.builtin.blockinfile:
    path: /etc/environment
    create: true
    mode: "0644"
    block: |
      HTTP_PROXY={{ gpu_validation_http_proxy }}
      HTTPS_PROXY={{ gpu_validation_https_proxy }}
      http_proxy={{ gpu_validation_http_proxy }}
      https_proxy={{ gpu_validation_https_proxy }}
      NO_PROXY={{ gpu_validation_no_proxy }}
      no_proxy={{ gpu_validation_no_proxy }}
  when: gpu_validation_http_proxy | default('') | length > 0

- name: Configure dnf proxy
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^proxy='
    line: "proxy={{ gpu_validation_http_proxy }}"
  when: gpu_validation_http_proxy | default('') | length > 0

- name: Configure container engine proxy
  ansible.builtin.file:
    path: /etc/systemd/system/podman.service.d
    state: directory
    mode: "0755"
  when: gpu_validation_http_proxy | default('') | length > 0

- name: Set container engine proxy environment
  ansible.builtin.copy:
    dest: /etc/systemd/system/podman.service.d/http-proxy.conf
    mode: "0644"
    content: |
      [Service]
      Environment="HTTP_PROXY={{ gpu_validation_http_proxy }}"
      Environment="HTTPS_PROXY={{ gpu_validation_https_proxy }}"
      Environment="NO_PROXY={{ gpu_validation_no_proxy }}"
  when: gpu_validation_http_proxy | default('') | length > 0

- name: Install needed driver dependency packages for RHEL
  when:
    - ansible_distribution == "RedHat"
    - gpu_validation_mode == "mig"
  block:
    - name: Execute bootstrap command - RHEL repo setup
      ansible.builtin.include_role:
        name: osp.edpm.edpm_bootstrap
        tasks_from: bootstrap_command.yml

    - name: Add EPEL repository for DKMS (UNSUPPORTED)
      ansible.builtin.yum_repository:
        name: epel
        description: EPEL YUM repo
        baseurl: "https://download.fedoraproject.org/pub/epel/{{ ansible_facts['distribution_major_version'] }}/Everything/$basearch/"
        enabled: 1
        gpgcheck: 1
        gpgkey: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts['distribution_major_version'] }}"

    - name: Install DKMS (UNSUPPORTED)
      ansible.builtin.dnf:
        use_backend: dnf4
        name:
          - dkms
          - kernel-devel
          - kernel-headers
        state: present

- name: Install pciutils package
  ansible.builtin.dnf:
    use_backend: dnf4
    name: pciutils
    state: present

- name: Install pip package
  ansible.builtin.dnf:
    use_backend: dnf4
    name: python-pip
    state: present

- name: Install podman package
  ansible.builtin.dnf:
    use_backend: dnf4
    name: podman
    state: present

- name: Copy scripts from local to RHEL AI machine
  ansible.builtin.copy:
    src: "{{ role_path }}/files/scripts"
    dest: /tmp
    mode: "1777"
